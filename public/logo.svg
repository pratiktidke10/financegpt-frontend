<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer black ring -->
  <circle cx="50" cy="50" r="49" fill="#1a1200"/>
  <!-- Gold rim -->
  <circle cx="50" cy="50" r="46" fill="#c8860a"/>
  <!-- Main coin body -->
  <circle cx="50" cy="50" r="42" fill="#f5c842"/>
  <!-- Shine -->
  <ellipse cx="42" cy="36" rx="16" ry="12" fill="#fde97a" opacity="0.4" transform="rotate(-20 42 36)"/>
  <!-- Dashes -->
  <g fill="#1a1200">
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(0 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(45 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(90 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(135 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(180 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(225 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(270 50 50)"/>
    <rect x="48" y="6" width="4" height="7" rx="1.5" transform="rotate(315 50 50)"/>
  </g>
  <!-- Rupee symbol -->
  <g stroke="#1a1200" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="32" y1="30" x2="68" y2="30"/>
    <line x1="32" y1="42" x2="62" y2="42"/>
    <line x1="36" y1="30" x2="36" y2="75"/>
    <line x1="62" y1="42" x2="44" y2="75"/>
    <path d="M36 30 Q54 30 54 36 Q54 42 36 42"/>
  </g>
  <!-- White highlights on rupee -->
  <g stroke="#fde97a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="32" y1="30" x2="68" y2="30"/>
    <line x1="32" y1="42" x2="62" y2="42"/>
    <line x1="36" y1="30" x2="36" y2="75"/>
    <line x1="62" y1="42" x2="44" y2="75"/>
    <path d="M36 30 Q54 30 54 36 Q54 42 36 42"/>
  </g>
</svg>